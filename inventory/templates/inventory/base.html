<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content="width=device-width, initial-scale=1.0">
    <link href='https://bootswatch.com/5/spacelab/bootstrap.min.css' rel='stylesheet'>

    <title>Medical Inventory Management System</title>

    <style>
        label {
            color: #000 !important;
        }
        .form-text {
            color: #222 !important;
        }
        .text-muted {
            color: #333 !important;
        }
        input::placeholder {
            color: #555 !important;
        }

        /* Custom button style */
        .btn {
            border-radius: 6px !important;
            border: none !important;
            background: rgb(60, 80, 20) !important;
            color: #fff !important;
            font-weight: 600 !important;
            transition: all 0.2s ease !important;
        }

        .btn:hover {
            background: rgb(40, 55, 10) !important;
            color: #fff !important;
        }

        .btn:active {
            background: rgb(30, 40, 5) !important;
            color: #fff !important;
        }

        /* keep danger buttons red for delete */
        .btn-danger {
            background: #dc3545 !important;
            border: none !important;
            color: #fff !important;
        }

        .btn-danger:hover {
            background: #b02a37 !important;
            color: #fff !important;
        }

        .btn:hover {
            background: rgb(138, 154, 91) !important;
            color: #fff !important;
            border-color: rgb(100, 120, 60) !important;
        }

        .btn:active {
            background: rgb(100, 120, 60) !important;
            color: #fff !important;
        }

        /* keep danger buttons red for delete */
        .btn-danger {
            border-color: #dc3545 !important;
            color: #dc3545 !important;
        }

        .btn-danger:hover {
            background: #dc3545 !important;
            color: #fff !important;
        }
    </style>
</head>
<body style="background-color: rgb(165, 180, 126);">
    {% include 'inventory/navigation.html' %}

    {% block content %}
    {% endblock content %}

    <script src='https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.bundle.min.js' crossorigin='anonymous'></script>

</body>
</html>
