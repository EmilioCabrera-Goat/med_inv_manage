{% extends 'inventory/base.html' %}
{% block content %}
<div class="container mt-4" style="max-width: 700px;">
    <a href="{% url 'index' %}" class="btn btn-outline-primary mb-3">Back</a>
    <h2>Support Chatbot</h2>
    <p class="text-muted">Ask any health or medication related question.</p>

    <div id="chat-box" style="
        height: 400px;
        overflow-y: auto;
        border: 1px solid #dee2e6;
        border-radius: 8px;
        padding: 15px;
        background: #f8f9fa;
        margin-bottom: 15px;
    ">
        <div class="text-muted text-center mt-5" id="placeholder">Ask me anything!</div>
    </div>

    <div class="input-group">
        <input type="text" id="user-input" class="form-control" placeholder="Type your question..." />
        <button class="btn btn-primary" onclick="sendMessage()">Send</button>
    </div>
    <small class="text-muted mt-1 d-block">Press Enter to send</small>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<script>
    const chatBox = document.getElementById('chat-box')
    const userInput = document.getElementById('user-input')

    function getCookie(name) {
        return document.cookie.split(';')
            .find(c => c.trim().startsWith(name + '='))
            ?.split('=')[1]
    }

    function appendMessage(role, text) {
        const placeholder = document.getElementById('placeholder')
        if (placeholder) placeholder.remove()

        const div = document.createElement('div')
        div.style.marginBottom = '12px'

        if (role === 'user') {
            div.innerHTML = `
                <div style="text-align: right;">
                    <span style="
                        background: #0d6efd;
                        color: white;
                        padding: 8px 12px;
                        border-radius: 15px 15px 0 15px;
                        display: inline-block;
                        max-width: 80%;
                        text-align: left;
                    ">${text}</span>
                </div>`
        } else if (role === 'bot') {
            div.innerHTML = `
                <div style="text-align: left;">
                    <div style="
                        background: white;
                        border: 1px solid #dee2e6;
                        padding: 8px 12px;
                        border-radius: 15px 15px 15px 0;
                        display: inline-block;
                        max-width: 80%;
                    ">${marked.parse(text)}</div>
                </div>`
        } else if (role === 'thinking') {
            div.id = 'thinking-indicator'
            div.innerHTML = `
                <div style="text-align: left;">
                    <span style="
                        background: white;
                        border: 1px solid #dee2e6;
                        padding: 8px 12px;
                        border-radius: 15px 15px 15px 0;
                        display: inline-block;
                        color: #aaa;
                    ">Thinking...</span>
                </div>`
        }

        chatBox.appendChild(div)
        chatBox.scrollTop = chatBox.scrollHeight
    }

    function sendMessage() {
        const message = userInput.value.trim()
        if (!message) return

        appendMessage('user', message)
        appendMessage('thinking')
        userInput.value = ''
        userInput.disabled = true

        fetch('/chatbot/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCookie('csrftoken')
            },
            body: JSON.stringify({ message: message })
        })
        .then(res => res.json())
        .then(data => {
            document.getElementById('thinking-indicator')?.remove()
            userInput.disabled = false
            userInput.focus()
            if (data.success) {
                appendMessage('bot', data.response)
            } else {
                appendMessage('bot', 'Sorry, something went wrong. Please try again.')
            }
        })
        .catch(() => {
            document.getElementById('thinking-indicator')?.remove()
            userInput.disabled = false
            appendMessage('bot', 'Error connecting to server.')
        })
    }

    userInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') sendMessage()
    })
</script>
{% endblock %}
