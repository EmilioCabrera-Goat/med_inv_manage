{% extends 'inventory/base.html' %}
{% load static %}

{% block content %}
<div style="
    background-image: url('{% static 'backdrops/backdrop1.JPG' %}');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    min-height: 100vh;
">
<div class="container">
    <div class="row justify-content-center align-items-center min-vh-100">
        <div class="col-md-6 col-lg-4">

        <div class="card shadow border-0" style="background: rgba(255, 255, 255, 0.67); backdrop-filter: blur(4px);">
        <div class="card-body p-4">

            <h3 class="fw-light mb-1" style="color: #111;">Home</h3>
            <p class="small mb-4" style="color: #333;">
            Take care of your health!
            </p>

            <div class="list-group list-group-flush">

            <a href="{% url 'dashboard' %}"
                class="list-group-item list-group-item-action d-flex justify-content-between align-items-center"
                style="background: rgba(255, 255, 255, 0.7); color: #000; font-weight: 500;">
                Dashboard
                <span style="color: #333;">→</span>
            </a>

            <a href="{% url 'information-page' %}"
                class="list-group-item list-group-item-action d-flex justify-content-between align-items-center"
                style="background: rgba(255, 255, 255, 0.7); color: #000; font-weight: 500;">
                Information
                <span style="color: #333;">→</span>
            </a>

            <a href="{% url 'support-page' %}"
                class="list-group-item list-group-item-action d-flex justify-content-between align-items-center"
                style="background: rgba(255, 255, 255, 0.7); color: #000; font-weight: 500;">
                Support
                <span style="color: #333;">→</span>
            </a>

            <a href="{% url 'pill-detection' %}"
                class="list-group-item list-group-item-action d-flex justify-content-between align-items-center"
                style="background: rgba(255, 255, 255, 0.7); color: #000; font-weight: 500;">
                Pill Recognition
                <span style="color: #333;">→</span>
            </a>

            </div>

        </div>
        </div>

        </div>
    </div>
</div>
</div>
{% endblock content %}
